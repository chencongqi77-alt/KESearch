[build-system]
requires = ["setuptools==70.2.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-survey"
version = "0.1.0"
description = "A local survey reader with section-level citation evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pypdf==6.10.0"]

[project.optional-dependencies]
full = ["PyMuPDF==1.27.2.2", "latex2mathml==3.81.0"]

[project.scripts]
deal-survey = "deal_survey.server:main"
deal-survey-prepare = "deal_survey.prepare:main"
deal-survey-settings = "deal_survey.settings:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["deal_survey"]
include-package-data = false

[tool.setuptools.package-data]
deal_survey = ["web/*.html", "web/*.css", "web/*.js"]
